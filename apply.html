<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Coaching | FitNS.Arc</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h2>FitNS.Arc</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="coaching.html">Coaching</a>
        <a href="index.html#tools">Tools</a>
        <a href="index.html#about">About</a>
    </nav>

</header>


<section>

    <p>FITNS.ARC / COACHING APPLICATION</p>

    <h1>
        Let's Build<br>
        Your Plan.
    </h1>

    <p>
        Tell us a little about yourself, your goal and
        what you want to achieve.
    </p>

</section>


<section>

    <h2>Coaching Application</h2>

    <form>

        <label>
            Name
        </label>

        <input type="text" name="name" required>


        <label>
            Email
        </label>

        <input type="email" name="email" required>


        <label>
            Phone / WhatsApp
        </label>

        <input type="tel" name="phone" required>


        <label>
            What are you looking for?
        </label>

        <select name="program" required>

            <option value="">Select a program</option>

            <option>Strength Training Coaching</option>

            <option>Fat Loss Program</option>

            <option>Running / Marathon Coaching</option>

            <option>Ironman Coaching</option>

        </select>


        <label>
            What is your primary goal?
        </label>

        <textarea name="goal" rows="5"></textarea>


        <label>
            Tell us about your current fitness/training
        </label>

        <textarea name="experience" rows="5"></textarea>


        <label>
            Anything else you'd like us to know?
        </label>

        <textarea name="message" rows="5"></textarea>


        <button type="submit">
            SUBMIT APPLICATION
        </button>

    </form>

</section>


<footer>

    <h3>FitNS.Arc</h3>

    <p>Train. Fuel. Perform.</p>

    <p>
        © 2026 FitNS.Arc. All rights reserved.
    </p>

</footer>

</body>

</html>
